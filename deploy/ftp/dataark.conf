[Unit]
RequiresMountsFor=/mnt/storage
ConditionPathIsMountPoint=/mnt/storage
After=local-fs.target

[Service]
PrivateMounts=true
ProtectHome=true
ProtectSystem=full
BindReadOnlyPaths=/mnt/storage:/srv/dataark-ftp/library
InaccessiblePaths=-/srv/dataark-ftp/library/.dataark-updates -/srv/dataark-ftp/library/.bugout-staging -/srv/dataark-ftp/library/bugout-drop -/srv/dataark-ftp/library/System\x20Volume\x20Information -/srv/dataark-ftp/library/$RECYCLE.BIN
