listen=YES
listen_ipv6=NO
anonymous_enable=YES
no_anon_password=YES
local_enable=NO
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO
anon_world_readable_only=YES
anon_root=/srv/dataark-ftp
hide_ids=YES
ls_recurse_enable=NO
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
port_enable=NO
max_clients=12
max_per_ip=4
idle_session_timeout=300
accept_timeout=60
connect_timeout=60
xferlog_enable=YES
xferlog_std_format=YES
ftpd_banner=Data Ark anonymous read-only library
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
hide_file={.*,bugout-drop,System Volume Information,$RECYCLE.BIN}
deny_file={.*,bugout-drop,System Volume Information,$RECYCLE.BIN}
