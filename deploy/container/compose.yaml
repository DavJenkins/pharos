name: dataark
services:
  ark:
    image: ${ARK_IMAGE:-dataark:local}
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      args:
        SOURCE_REVISION: ${ARK_REVISION:-development}
    ports:
      - "${ARK_BIND:-0.0.0.0}:${ARK_PORT:-8088}:8088"
    volumes:
      - type: bind
        source: ${ARK_MEDIA:?Set ARK_MEDIA to the existing library folder}
        target: /mnt/storage
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARK_CONFIGURATION:?Set ARK_CONFIGURATION to an existing writable public configuration folder}
        target: /config
        bind:
          create_host_path: false
      - state:/var/lib/dataark
      - private:/etc/dataark
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  state:
  private:
