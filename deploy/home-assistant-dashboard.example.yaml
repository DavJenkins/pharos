title: Data Ark
views:
- title: Data Ark
  path: overview
  cards:
  - type: entities
    title: Data Ark health
    entities:
    - sensor.data_ark_health
    - binary_sensor.data_ark_problem
    - sensor.data_ark_bugout
  - type: entities
    title: Library activity
    entities:
    - sensor.data_ark_collection_activity
    - entity: sensor.data_ark_collection_changes
      name: Last change sequence
  - type: markdown
    title: Current collection
    content: '{% set a = state_attr(''sensor.data_ark_collection_changes'', ''activity'')
      or {} %}{% set u = a.get(''updater'', {}) %}{{ u.get(''title'') or ''No active
      collection download'' }}{% if u.get(''percent'') is not none %} — {{ u.percent
      }}%{% endif %}


      Collection changes are recorded in Activity. Outcomes appear in Notifications.'
  - type: markdown
    title: HTTPS certificate
    content: '{% set cert = state_attr(''sensor.data_ark_health'', ''certificate'')
      or {} %}{{ cert.get(''certificate_health'', cert.get(''phase'', ''Not configured''))
      | replace(''_'', '' '') | capitalize }}{% if ''days_remaining'' in cert %} —
      {{ cert.days_remaining }} days remaining{% endif %}'
  - type: markdown
    title: Needs attention
    content: '{% set problems = state_attr(''sensor.data_ark_health'', ''problems'')
      or [] %}

      {% for item in problems %}- **{{ item.severity | title }}:** {{ item.message
      }}

      {% else %}No reported problems.{% endfor %}'
  - type: button
    name: Request bug-out
    icon: mdi:bag-personal
    tap_action:
      action: perform-action
      perform_action: script.request_dataark_bugout
      confirmation:
        text: Start the Ark’s configured bug-out tasks?
  - type: markdown
    title: How this works
    content: 'Health is checked every 30 seconds. Home Assistant records changes and
      raises notifications. Ark-originated bug-out runs produce the household_bugout
      event for your chosen automations. No household alarm, shutdown, or power actions
      are attached automatically.


      [Open Data Ark](http://dataark/) · [Integration guide](http://dataark/docs/20-Administration/HomeAssistant.html)'
