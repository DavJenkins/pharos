system:
  project_name: Data Ark
  version: '1.4'
  theme: Ark of the Covenant
  base_mount: /mnt/storage
  hide_missing: true
  services:
    kiwix_port: 8080
    samba_share_path: /mnt/storage
    web_root: /var/www/html
    content_url_prefix: /library-files/
  artwork:
    path: app/static/assets/Pharos Data Ark.png
    alt: Data Ark lighthouse
geography:
  country: US
  state:
    code: MA
    name: Massachusetts
  counties:
    - name: Worcester
      focus: Northern Worcester County
    - name: Middlesex
maps:
  enabled: true
  refresh_days: 30
  reserve_gib: 10
  max_run_gib: 8
  sources:
    - flood
    - parcels
    - topographic
categories:
  - id: content_sources
    title: Content sources
    description: Explore the sources and content collected on this Ark. Local availability
      is shown for each registered asset.
  - id: zim_archives
    title: Offline knowledge libraries
    description: Read locally preserved archives with Kiwix, or download the original
      files.
  - id: reference
    title: Reference sources
    description: Online sources to explore and build your own collection.
  - id: pdf_reference
    title: PDF reference vault
    description: Medical, communications, engineering, and administrative documents.
  - id: utilities_binaries
    title: Portable utilities
    description: Readers and tools to take with the content.
scenarios:
  - id: general
    title: General reference
  - id: medical
    title: Medical reference
  - id: technical
    title: Technical reference
repositories:
  - id: wikipedia
    category: content_sources
    title: Wikipedia
    description: English encyclopedias preserved on this Ark.
    artwork:
      path: app/static/assets/icons/Wikipedia.png
      alt: Wikipedia
    update_policy: manual
    refresh_interval: never
    tags:
      - encyclopedia
    scenarios:
      - general
    links:
      - title: Wikipedia (local)
        service: kiwix
        path: /#name=wikipedia_en_all
      - title: Wikipedia
        url: https://www.wikipedia.org
        requires_internet: true
  - id: technical-qa
    category: content_sources
    title: Technical Q&A
    description: Electronics and Unix/Linux questions and answers, with a portable
      reader.
    artwork:
      path: app/static/assets/icons/Kiwix.png
      alt: Kiwix
    update_policy: manual
    refresh_interval: never
    scenarios:
      - technical
    links:
      - title: Read local technical Q&A
        service: kiwix
        path: /#category=stack_exchange
      - title: Electronics Q&A
        url: https://electronics.stackexchange.com
        requires_internet: true
      - title: Unix and Linux Q&A
        url: https://unix.stackexchange.com
        requires_internet: true
  - id: wikimed
    category: content_sources
    title: WikiMed
    description: A locally preserved medical encyclopedia.
    artwork:
      path: app/static/assets/icons/WikiMed.png
      alt: WikiMed
    update_policy: manual
    scenarios:
      - medical
    links:
      - title: Read local WikiMed
        service: kiwix
        path: /#name=wikipedia_en_medicine
      - title: Kiwix medical resources
        url: https://www.kiwix.org
        requires_internet: true
  - id: ifixit
    category: content_sources
    title: iFixit Repair Guides
    description: Step-by-step English repair guides with photos, preserved for offline
      use. By iFixit and its contributors, CC BY-NC-SA 3.0.
    update_policy: on_network_available
    refresh_interval: 1d
    tags:
      - repair
      - maintenance
      - illustrated
    scenarios:
      - technical
      - general
    links:
      - title: Read repair guides (local)
        service: kiwix
        path: /#name=ifixit_en_all
      - title: Attribution and license
        url: /legal/ifixit.html
      - title: iFixit (online)
        url: https://www.ifixit.com
        requires_internet: true
  - id: project-gutenberg
    enabled: false
    category: content_sources
    title: Project Gutenberg
    description: Public-domain reading sources. Register local books as assets below.
    artwork:
      path: app/static/assets/icons/ProjectGutenberg.png
      alt: Project Gutenberg
    links:
      - title: Project Gutenberg
        url: https://www.gutenberg.org
        requires_internet: true
  - id: usa-gov
    enabled: false
    category: content_sources
    title: USA.gov
    description: Government reference and information sources.
    artwork:
      path: app/static/assets/icons/USAGov.png
      alt: USA.gov
    links:
      - title: USA.gov
        url: https://www.usa.gov
        requires_internet: true
  - id: openstreetmap
    enabled: true
    category: content_sources
    title: Offline street map
    description: Massachusetts and adjoining border areas. Local OpenStreetMap-derived
      vector map with offline pan and zoom; no routing or search.
    artwork:
      path: app/static/assets/icons/OpenStreetmap.png
      alt: OpenStreetMap
    links:
      - title: Open the offline street map
        url: /maps.html
      - title: Map sources and maintenance
        url: /docs/20-Administration/OfflineReferences.html
    update_policy: manual
    refresh_interval: never
  - id: preparedness
    category: content_sources
    title: Emergency preparedness and CERT
    description: FEMA preparedness and CERT manuals, preserved as readable PDFs. Massachusetts
      MEMA downloads are pending publisher access.
    update_policy: manual
    refresh_interval: never
    links:
      - title: Open local preparedness references
        url: /library-files/preparedness/index.html
