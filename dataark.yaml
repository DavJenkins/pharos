    expected_hash: "9a1570f2f346aa18694ee520e0483f19b7447f69e0970e2f727c53ccf0dcc7d6"
  - id: electronics-qa
    online_url: https://electronics.stackexchange.com/
    repository_id: technical-qa
    category: zim_archives
    title: Electronics Stack Exchange (August 2026)
    relative_path: electronics.stackexchange.com_en_all_2026-08.zim
    update_policy: on_network_available
    refresh_interval: 1d
    update_source:
      kind: kiwix_zim
      directory: https://download.kiwix.org/zim/stack_exchange/
      filename_prefix: electronics.stackexchange.com_en_all_
    download_url: https://download.kiwix.org/zim/stack_exchange/electronics.stackexchange.com_en_all_2026-08.zim
    expected_hash: "5a23c08a3c1275128c247b0c67ec8ed03a953a504c6a23e2cd6a9ac5422b88c1"
  - id: unix-qa
    online_url: https://unix.stackexchange.com/
    repository_id: technical-qa
    category: zim_archives
    title: Unix Stack Exchange (August 2026)
    relative_path: unix.stackexchange.com_en_all_2026-08.zim
    update_policy: on_network_available
    refresh_interval: 1d
    update_source:
      kind: kiwix_zim
      directory: https://download.kiwix.org/zim/stack_exchange/
      filename_prefix: unix.stackexchange.com_en_all_
    download_url: https://download.kiwix.org/zim/stack_exchange/unix.stackexchange.com_en_all_2026-08.zim
