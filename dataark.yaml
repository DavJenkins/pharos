  - id: kiwix-windows-reader
    online_url: https://kiwix.org/en/applications/
    repository_id: technical-qa
    category: utilities_binaries
    title: Kiwix Desktop for Windows (copy the entire kiwix-viewer folder)
    relative_path: kiwix-viewer/kiwix-desktop.exe
    download_url: https://download.kiwix.org/release/kiwix-desktop/kiwix-desktop_windows_x64_2.5.1.zip
    source_note: Windows ZIP distribution with dependencies; embedded executable version string is 2.5.1. Byte identity not checked.
    architecture: x86_64
    executable: true
    tags: [windows, reader]

# Optional nested sections below the repository cards. See Manifest documentation.
resource_sections: []

# Household sources: credentials are supplied privately through the landing page.
bugout:
  budget_seconds: 300
  reserve_gib: 2
  tasks:
    - id: manuals
      title: Manuals
      kind: smb
      host: 192.168.40.127
      share: Manuals
      credential: manuals-reader
      priority: 100
      prefetch: true
      prefetch_interval: 1d
      normal_sync: scheduled
      include_in_bugout: true
      timeout_seconds: 3600
      encryption:
        method: none
