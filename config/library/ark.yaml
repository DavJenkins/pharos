format: dataark-project-v1
type_registry: config/content-types.yaml
collections:
- collections/wikipedia.yaml
- collections/technical-qa.yaml
- collections/wikimed.yaml
- collections/ifixit.yaml
- collections/openstreetmap.yaml
- collections/project-gutenberg.yaml
- collections/usa-gov.yaml
- collections/preparedness.yaml
- collections/forms-templates.yaml
- collections/family-resources.yaml
- collections/resilience.yaml
- collections/civic-reference.yaml
- collections/radio-study.yaml
- collections/vehicle-manuals.yaml
- collections/food-preservation.yaml
- collections/sanitation.yaml
- collections/drinking-water.yaml
- collections/shelter-winter.yaml
- collections/first-aid-care.yaml
- collections/growing-food.yaml
- collections/repairs.yaml
- collections/navigation-field.yaml
- collections/emergency-comms.yaml
