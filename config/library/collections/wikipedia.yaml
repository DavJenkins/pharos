repository:
  id: wikipedia
  category: content_sources
  title: Wikipedia - English
  preferred_variant: with-images
  variants:
  - id: with-images
    title: With images
    asset_id: wikipedia-main
    description: Richly illustrated encyclopedia; larger download and storage requirement.
  - id: without-images
    title: Without images
    asset_id: wikipedia-nopic
    description: Text-focused encyclopedia; smaller download and storage requirement.
  description: English encyclopedias preserved on this Ark.
  artwork:
    path: app/static/assets/icons/Wikipedia.png
    alt: Wikipedia
  update_policy: manual
  refresh_interval: never
  tags:
  - encyclopedia
  scenarios:
  - general
  links:
  - title: Wikipedia (local)
    service: kiwix
    path: /#name=wikipedia_en_all
  - title: Wikipedia
    url: https://www.wikipedia.org
    requires_internet: true
catalogue: catalogues/wikipedia.yaml
versions: state/versions/wikipedia.yaml
