<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Ark Events</title>
  <style>
    body { font-family: monospace; margin: 1.5rem; background: #202124; color: #e8e8e8; }
    a { color: #7fc8ff; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    button, input { font: inherit; padding: .5rem; }
  </style>
</head>
<body>
  <a href="/">Back to dashboard</a>
  <h1>Recent Events</h1>
  <p>Shows up to the latest 1,000 events, newest first.</p>
  <label>Filter events <input id="search" type="search"></label>
  <button id="refresh" type="button">Refresh</button>
  <p id="status" role="status"></p>
  <pre id="events"></pre>
  <script src="/assets/js/api.js"></script>
  <script>
    "use strict";
    let events = [];
    function render() {
      const query = document.getElementById("search").value.toLowerCase();
      document.getElementById("events").textContent = events
        .map(event => JSON.stringify(event))
        .filter(line => line.toLowerCase().includes(query)).join("\n");
    }
    async function refresh() {
      const button = document.getElementById("refresh");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "Loading events…";
      try {
        events = (await DataArkAPI.getEvents(1000)).reverse();
        render();
        status.textContent = events.length ? `${events.length} events loaded.` : "No events recorded.";
      } catch (error) {
        status.textContent = `Unable to refresh events: ${error.message}. Previously loaded events may be out of date.`;
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("refresh").addEventListener("click", refresh);
    refresh();
  </script>
</body>
</html>
