<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Ark Events</title>

<link rel="stylesheet" href="/assets/css/ark-pages.css?v=0d1bad11b6560326"><link rel="stylesheet" href="/assets/css/page-close.css?v=371cdf1a141503fb"><link rel="stylesheet" href="/assets/css/ark-brand.css?v=3"></head>
<body><main class="ark-page"><header class="ark-app-masthead"><div class="ark-page-brand ark-shared-brand"><a class="ark-maker" href="https://www.dejsoftware.com/" title="DEJ Software website (internet required)"><img src="/assets/dej-software-footer.webp" alt="DEJ Software™" width="1024" height="192"></a><a class="ark-home" href="/"><span class="ark-product-wordmark" role="img" aria-label="Pharos Data Ark"><span class="ark-pharos-part"><img src="/assets/pharos-data-ark-clean.png" alt=""></span><span class="ark-data-part"><img src="/assets/pharos-data-ark-clean.png" alt=""></span></span></a></div></header>
  <a href="/">Back to dashboard</a>
  <h1>Recent Events</h1>
  <p>Shows up to the latest 1,000 events, newest first.</p>
  <label>Filter events <input id="search" type="search"></label>
  <button id="refresh" type="button">Refresh</button>
  <p id="status" role="status"></p>
  <pre id="events"></pre>
  <script src="/assets/js/api.js?v=3da5b140545f4168"></script>
  <script>
    "use strict";
    let events = [];
    function render() {
      const query = document.getElementById("search").value.toLowerCase();
      document.getElementById("events").textContent = events
        .map(event => JSON.stringify(event))
        .filter(line => line.toLowerCase().includes(query)).join("\n");
    }
    async function refresh() {
      const button = document.getElementById("refresh");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "Loading events…";
      try {
        events = (await DataArkAPI.getEvents(1000)).reverse();
        render();
        status.textContent = events.length ? `${events.length} events loaded.` : "No events recorded.";
      } catch (error) {
        status.textContent = `Unable to refresh events: ${error.message}. Previously loaded events may be out of date.`;
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("refresh").addEventListener("click", refresh);
    refresh();
  </script>
<div class="ark-page-actions"><a href="/">Close</a></div></main><script src="/assets/js/background-sign-link.js"></script></body>
</html>
