<!-- /var/www/html/logs.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Data ARK Logs</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; padding: 20px; }
        .controls { margin-bottom: 20px; padding: 10px; background: #333; border-radius: 8px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        iframe { width: 100%; height: 70vh; border: none; background: #000; padding: 10px; color: #00ff00; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .close-btn { font-size: 1.2em; padding: 5px 15px; color: #ff4444; }
    </style>
</head>
<body>
    <div class="controls">
        <!-- Close button to close the window/tab -->
        <button class="close-btn" onclick="window.close()">&#10006;</button>
        
        <form id="logForm">
            <input type="text" id="searchInput" placeholder="Search logs...">
            <button type="submit">Search</button>
        </form>
        <button id="prevBtn" onclick="changePage(-1)" disabled>Previous Page</button>
        <button onclick="changePage(1)">Next Page</button>
        <button onclick="window.location.reload()">Refresh</button>
    </div>
    <iframe id="logFrame" src="logs.php?page=0"></iframe>

    <script>
        let currentPage = 0;
        let currentSearch = "";

        document.getElementById('logForm').onsubmit = (e) => {
            e.preventDefault();
            currentPage = 0;
            currentSearch = document.getElementById('searchInput').value;
            updateIframe();
        };

        function changePage(delta) {
            currentPage = Math.max(0, currentPage + delta);
            document.getElementById('prevBtn').disabled = (currentPage === 0);
            updateIframe();
        }

        function updateIframe() {
            const url = `logs.php?page=${currentPage}&search=${encodeURIComponent(currentSearch)}`;
            document.getElementById('logFrame').src = url;
        }
    </script>
</body>
</html>
