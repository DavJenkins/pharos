<body data-action="rename"><main class="network-settings-card"><a class="ark-page-brand" href="/">Data Ark</a>
<nav><a href="/">Dashboard</a><a href="/config/wifi.html">Upstream Wi-Fi</a><a href="/config/system.html">Access point</a></nav>
<p><a href="/config/adapters.html">Wi-Fi adapter assignment</a></p>
<h1>Rename the DataArk access point</h1>
<p id="current" role="status">Loading current network…</p>
<form id="network-form">
<input id="admin-password" type="hidden" autocomplete="off">

<label>Access-point name (SSID)<input id="ssid" required autocomplete="off"></label>
<p class="notice">Renaming the access point disconnects its connected devices. Reconnect to the new Wi-Fi name, then open http://192.168.4.1/.</p>
<label><input id="acknowledge" type="checkbox" required> I understand that devices may need to reconnect.</label>
<button id="save" type="submit">Save AP Name</button>
</form>
<p id="result" role="status" aria-live="polite"></p>
<script src="/assets/js/caretaker-auth.js?v=d97c8870e4070f12"></script>
<script src="/assets/js/network-settings.js?v=ebf32e1f78e9d520"></script>
<div class="ark-page-actions"><a href="/">Close</a></div></main></body>
